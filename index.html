<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ps-note</title>
    <!-- Menghubungkan file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Box -->
    <div id="login-box">
        <div class="card">
            <h2>🔒 ps-note</h2>
            <p style="margin-bottom: 15px; color: #555; font-size: 14px;">Enter password to unlock</p>
            <div style="display: flex; gap: 10px;">
                <input type="password" id="password" placeholder="Password">
                <button onclick="unlockNote()">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Notepad App -->
    <div id="app" class="fullscreen-container hidden">
        <div class="header-app">
            <h2>📝 ps-note</h2>
            <span id="status"></span>
        </div>

        <!-- Barisan Tab + Tombol Setting di Ujung Kanan -->
       <div class="tab-bar">
            <div class="tab-left-group">
                <div id="tabs-container" style="display: flex; gap: 5px; align-items: center;"></div>
                <button class="add-tab-btn" onclick="addNewTab()" title="Add New Tab">+</button>
            </div>
            <!-- Tombol Gembok yang senada -->
            <button class="settings-btn" onclick="changePassword()" title="Change Password">🔒</button>
        </div>

        <textarea id="content" placeholder="Write something.." oninput="handleTyping()"></textarea>
        
        <div class="footer-bar">
            <span style="font-size: 13px; color: #888;">Auto-save enabled</span>
            <button class="save-btn" onclick="saveData()">Save</button>
        </div>
    </div>

    <!-- Menghubungkan file JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
